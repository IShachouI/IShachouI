name: Generate Snake Animation

on:
  # Regenerate once a day (00:00 UTC).
  schedule:
    - cron: "0 0 * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:
  # Keep the output fresh whenever the profile is updated.
  push:
    branches:
      - main

# Least privilege: we only need to push the generated SVGs to the output branch.
permissions:
  contents: write

# Never run two generations against the same ref at once.
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the contribution-snake SVGs
        uses: Platane/snk@v3
        id: snake-generate
        with:
          github_user_name: ${{ github.repository_owner }}
          # One file per line. Query params customise palette / colors / background.
          # color_background=%2300000000 -> fully transparent (blends into any README).
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_background=%2300000000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_background=%2300000000

      - name: Publish the SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "chore: regenerate contribution snake [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
